{% extends "base/_base.html" %}

{% load allauth %}

{% block head_title %}

    <div class="card mx-auto text-center" style="max-width: 600px; padding: 20px;">

            <h1 class="h4">
                {% trans "Change Password" %}

        </div>
        <div class="card-body">

                    <a href="{% url "home" %}">رفتن به خانه</a>

                </div>
            </p>
        </div>
    </div>
</div>

{% endblock content %}
