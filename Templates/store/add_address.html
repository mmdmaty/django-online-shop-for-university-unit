{% extends "base/_base.html" %}
{% block content %}
<form method="post" class="address-form">
    {% csrf_token %}

    <!-- فیلد آدرس -->
    <div class="form-group">
        <label for="id_address">آدرس کامل:</label>
        <textarea name="address" id="id_address" rows="3" class="form-control" placeholder="مثال: تهران، خیابان آزادی، پلاک ۱۲۳"></textarea>
    </div>

    <!-- فیلد کد پستی -->
    <div class="form-group">
        <label for="id_postal_code">کد پستی:</label>
        <input type="text" name="postal_code" id="id_postal_code" class="form-control" placeholder="مثال: 1234567890">
    </div>

    <!-- فیلد شهر -->
    <div class="form-group">
        <label for="id_city">شهر:</label>
        <input type="text" name="city" id="id_city" class="form-control" placeholder="مثال: تهران">
    </div>

    <button type="submit" class="btn btn-success">ثبت آدرس</button>
</form>


{% endblock content %}
