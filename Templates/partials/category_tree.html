<ul>
    {% for category in categories %}
        <li class="category-item" style="list-style:none; margin-bottom:5px;">
            <span class="category-toggle" onclick="toggleSubcategories({{ category.id }}, this)" style="cursor:pointer; display: inline-flex; align-items: center;">
                <span id="icon-{{ category.id }}" class="category-icon" style="display:inline-block; width: 15px; text-align:center; margin-right: 5px;">&#9654;</span>
                <a href="#" onclick="event.preventDefault(); selectCategory('{{ category.name }}')" style="text-decoration:none; color: #333;">
                    {{ category.name }}
                </a>
            </span>
            {% if category.get_children %}
                <ul class="subcategory-list" id="subcategory-{{ category.id }}" style="display:none; padding-left: 20px; margin-top: 3px;">
                    {% include "partials/category_tree.html" with categories=category.get_children %}
                </ul>
            {% endif %}
        </li>
    {% endfor %}
</ul>



<script>
    function toggleSubcategories(categoryId, toggleElement) {
        const subcategoryList = document.getElementById(`subcategory-${categoryId}`);
        const iconElement = document.getElementById(`icon-${categoryId}`);

        if (subcategoryList.style.display === "none") {
            subcategoryList.style.display = "block";
            iconElement.innerHTML = "&#9660;"; // فلش رو به پایین
        } else {
            subcategoryList.style.display = "none";
            iconElement.innerHTML = "&#9654;"; // فلش رو به راست
        }
    }

    function selectCategory(categoryName) {
        const baseUrl = "{% url 'home' %}";   
        const newUrl = `${baseUrl}?category=${encodeURIComponent(categoryName)}`;
        window.location.href = newUrl;
    }
</script>
